openapi: "3.0.3"
info:
  title: UNICHE MCP Transport
  description: |
    Informational spec for the UNICHE Cloud MCP SSE transport. This file is
    not fed to any code generator -- it exists so partners and third-party
    developers can explore the JSON-RPC protocol using Swagger UI or similar
    tooling.

    The MCP server listens on port 8081 by default (set MCP_PORT to override).
    Set MCP_TRANSPORT=sse to enable the SSE transport; the default is stdio.

    > **The examples in this spec are for illustrative purposes only and cannot
    > be executed directly from this UI.** Two reasons: `GET /sse` opens a
    > persistent Server-Sent Events stream that browsers cannot display inline,
    > and `POST /message` requires a `sessionId` query parameter that is only
    > issued after a live SSE connection is established. To interact with the
    > transport, open `/sse` in a browser tab or via curl first, copy the
    > session ID from the `endpoint` event, then send JSON-RPC frames to
    > `/message?sessionId=<id>`.
  version: "0.1.0"

servers:
  - url: http://localhost:8081
    description: Local development (MCP SSE transport)

paths:
  /sse:
    get:
      operationId: openSSEStream
      summary: Open MCP SSE connection
      description: >
        Establishes a persistent Server-Sent Events connection. The server
        streams JSON-RPC response frames over this connection for the lifetime
        of the session. Each event carries a single JSON-RPC message as its
        data payload.

        On connect the server emits an endpoint event containing the URL the
        client must use for POST /message.
      responses:
        '200':
          description: SSE stream opened.
          content:
            text/event-stream:
              schema:
                type: string
                description: >
                  Newline-delimited SSE frames. Each frame is a JSON-RPC 2.0
                  response or notification object.
                example: |
                  event: endpoint
                  data: /message?sessionId=abc123

                  data: {"jsonrpc":"2.0","id":1,"result":{"protocolVersion":"2025-11-25","capabilities":{"tools":{},"resources":{}},"serverInfo":{"name":"uniche-cloud","version":"1.0.0"}}}

  /message:
    post:
      operationId: sendMessage
      summary: Send a JSON-RPC message
      description: >
        Sends a single JSON-RPC 2.0 request to the MCP server. The session
        must first be established via GET /sse; include the sessionId query
        parameter returned in the endpoint event.

        Supported methods: initialize, tools/list, tools/call,
        resources/list, resources/read.
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
          description: Session ID received from the SSE endpoint event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            examples:
              initialize:
                summary: Initialize session
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: initialize
                  params:
                    protocolVersion: "2025-11-25"
                    capabilities: {}
                    clientInfo:
                      name: MyClient
                      version: "1.0.0"
              tools_list:
                summary: List available tools
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: tools/list
              tools_call_brainstorm:
                summary: Call brainstorm tool
                value:
                  jsonrpc: "2.0"
                  id: 3
                  method: tools/call
                  params:
                    name: brainstorm
                    arguments:
                      scene: Bronze Age burial chamber
                      audiences:
                        - school groups
                        - specialist visitors
              tools_call_rewrite:
                summary: Call rewrite tool
                value:
                  jsonrpc: "2.0"
                  id: 4
                  method: tools/call
                  params:
                    name: rewrite
                    arguments:
                      content: The stratigraphic sequence indicates a mid-3rd millennium BCE interment.
                      audience: children
              tools_call_verify:
                summary: Call verify tool
                value:
                  jsonrpc: "2.0"
                  id: 5
                  method: tools/call
                  params:
                    name: verify
                    arguments:
                      draft: The burial chamber dates to around 2400 BCE and contained bronze artefacts.
              resources_list:
                summary: List available resources
                value:
                  jsonrpc: "2.0"
                  id: 6
                  method: resources/list
              resources_read_search:
                summary: Read asset search resource
                value:
                  jsonrpc: "2.0"
                  id: 7
                  method: resources/read
                  params:
                    uri: assetiq://search
                    arguments:
                      q: Bronze Age burial chamber
              resources_read_preview:
                summary: Read asset preview resource
                value:
                  jsonrpc: "2.0"
                  id: 8
                  method: resources/read
                  params:
                    uri: assetiq://preview
      responses:
        '200':
          description: >
            JSON-RPC response. Check the result or error field; HTTP 200 is
            returned even when the JSON-RPC layer reports an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'

components:
  schemas:
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: integer
            - type: string
          description: Omit for notifications (no response expected).
        method:
          type: string
          enum:
            - initialize
            - tools/list
            - tools/call
            - resources/list
            - resources/read
        params:
          type: object
          description: Method-specific parameters; see examples above.
          additionalProperties: true

    JsonRpcResponse:
      type: object
      required: [jsonrpc, id]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: integer
            - type: string
        result:
          type: object
          description: Present on success; structure varies by method.
          additionalProperties: true
        error:
          $ref: '#/components/schemas/JsonRpcError'

    JsonRpcError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: >
            Standard JSON-RPC error codes: -32700 parse error, -32600 invalid
            request, -32601 method not found, -32602 invalid params,
            -32603 internal error.
        message:
          type: string
        data:
          description: Optional additional error detail.
