version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - cyclop
    - depguard
    - dupl
    - forbidigo
    - gocritic
    - nakedret
    - nestif
    - prealloc
    - revive
    - unparam
    - unused
    - varnamelen
  settings:
    cyclop:
      max-complexity: 10
      package-average: 5
    depguard:
      rules:
        # Only api/*.go; the generated api/gatewayapi and api/repositoryapi
        # import ogen and are not matched.
        api-stdlib-only:
          list-mode: strict
          files:
            - "**/api/*.go"
          allow:
            - $gostd
        # rdf is a leaf: it may not import anything else in this module.
        rdf-leaf:
          list-mode: strict
          files:
            - "**/rdf/*.go"
          allow:
            - $gostd
            - github.com/piprate/json-gold
            - github.com/stretchr/testify
        web-only-from-cmd:
          files:
            - $all
            - "!**/cmd/**/*.go"
          deny:
            - pkg: uniche/web$
              desc: web is the HTTP edge; only entry points under cmd/ (main today, CLI commands later) may wire it
        assetiq-boundary:
          files:
            - "**/assetiq/*.go"
            - "**/assetiq/**/*.go"
          deny:
            - pkg: uniche/repository$
              desc: assetiq may import api/repositoryapi (the generated contract) but never repository itself
        repository-boundary:
          files:
            - "**/repository/*.go"
            - "**/repository/**/*.go"
          deny:
            - pkg: uniche/assetiq
              desc: repository must not import assetiq; they connect in cmd/server
    dupl:
      threshold: 100
    forbidigo:
      forbid:
        - pattern: ^panic$
          msg: "panic is only allowed at the application entry point"
    gocritic:
      disable-all: true
      enabled-checks:
        - badRegexp
        - regexpMust
        - regexpSimplify
    nestif:
      min-complexity: 5
    revive:
      rules:
        - name: function-result-limit
          arguments:
            - 3
        - name: argument-limit
          arguments:
            - 5
    varnamelen:
      max-distance: 20
      min-name-length: 3
      ignore-names:
        - db   # database handle
        - i    # loop index
        - k    # k-nearest-neighbors / loop index
        - r    # range iteration variable / router / request
        - tc   # table-driven test case
        - tt   # table-driven test case
        - tx   # database transaction
      ignore-decls:
        - c echo.Context
        - f *os.File
        - h *Handlers
        - r chi.Router
        - r *http.Request
        - t testing.T
        - w http.ResponseWriter
        - wg sync.WaitGroup
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: '(^|/)main\.go$'
        linters:
          - forbidigo
      - linters:
          - cyclop
        path: (.+)_test\.go
      # views' package-average cyclop score is dominated by templ-generated
      # render functions ("Code generated by templ - DO NOT EDIT"), which
      # aren't hand-maintained and can't be simplified; this only excludes
      # the package-average metric, not per-function complexity checks.
      - linters:
          - cyclop
        text: "average complexity for the package views"
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
